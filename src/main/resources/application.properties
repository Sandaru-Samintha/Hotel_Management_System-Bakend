spring.application.name=Hotel_Management_System



# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/Nexus_Haven_Hotel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sandaru
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: Logging SQL Queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# AWS credentials
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}

# AWS region
aws.region=${AWS_REGION}

# S3 bucket
aws.s3.bucket-name=${AWS_BUCKET_NAME}






