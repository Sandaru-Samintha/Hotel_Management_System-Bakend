spring.application.name=Hotel_Management_System



# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/Nexus_Haven_Hotel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sandaru
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: Logging SQL Queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# AWS credentials
cloud.aws.credentials.access-key=${aws.s3.access-key}
cloud.aws.credentials.secret-key=${aws.s3.secret-key}

# AWS region
cloud.aws.region.static=${aws.region}

# S3 bucket
cloud.aws.s3.bucket-name=${aws.s3.bucket-name}



