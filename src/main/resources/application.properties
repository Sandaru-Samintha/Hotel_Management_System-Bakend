spring.application.name=Hotel_Management_System



# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/Nexus_Haven_Hotel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sandaru
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional: Logging SQL Queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# AWS credentials
aws.s3.access-key=YOUR_ACCESS_KEY
aws.s3.secret-key=YOUR_SECRET_KEY

# AWS region
aws.region=us-east-1

# S3 bucket
aws.s3.bucket-name=my-s3-bucket

# Optional (recommended)
aws.s3.endpoint=https://s3.amazonaws.com



